# PolicyProbe Policy Configuration
#
# This file defines the security policies for the application.
#
# SECURITY NOTES (for Unifai demo):
# - Policies are defined but NOT ENFORCED in vulnerable version
# - After Unifai remediation, these policies will be active

policies:
  pii_detection:
    enabled: true
    description: "Detect and block PII in uploaded files"
    actions:
      - scan_uploads
      - block_if_found
      - log_violation
    severity: high

    prompt_injection:
    enabled: true  # ENFORCED: Runtime prompt injection detection active
    description: "Detect hidden prompts and malicious content"
    actions:
      - scan_content
      - detect_hidden_text
      - block_threats
    severity: critical

    agent_authentication:
    enabled: true
    description: "Require authentication for inter-agent communication"
    actions:
      - validate_token
      - check_privileges
      - detect_escalation
      - block_escalation
      - audit_access
    severity: high

  response_validation:
    enabled: true
    description: "Validate and sanitize LLM responses for policy compliance, including detection of dynamic code execution primitives"
    actions:
      - check_pii_leakage
      - check_bias
      - filter_harmful
      - detect_eval_usage
      - detect_dynamic_code_execution
      - sanitize_output
      - block_if_violation
    severity: critical

# Privilege levels for agent access control
privilege_levels:
  low:
    level: 1
    allowed_agents:
      - tech_support
    allowed_resources:
      - public_data
      - user_queries

  medium:
    level: 2
    allowed_agents:
      - tech_support
      - file_processor
    allowed_resources:
      - public_data
      - user_queries
      - file_processing

  high:
    level: 3
    allowed_agents:
      - tech_support
      - file_processor
      - finance
    allowed_resources:
      - public_data
      - user_queries
      - file_processing
      - financial_data

  admin:
    level: 4
    allowed_agents:
      - admin_agent
    allowed_resources:
      - public_data
      - user_queries
      - file_processing
      - financial_data
      - audit_logs
    escalation_detection: true
    block_escalation: true

# Logging configuration
logging:
  audit_enabled: true  # Audit logging enabled to record all MCP interactions
  log_level: INFO
  include_content: true  # VULNERABILITY: Content in logs
  mask_pii: true
